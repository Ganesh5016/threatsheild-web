name: DevSecOps Automated Security Assessment & Vulnerability Audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  security-audit:
    name: Auto Detect Stack, SAST, DAST, Dependency Scan & Generate Security Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔎 Phase 1 & 2: Detect Stack & Generate API Inventory
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas
          python "Vulnerability Test Results/generate_security_reports.py"

      - name: 🛡️ Phase 3: Run SAST & Security Linting
        run: |
          echo "Running SAST source code security analysis..."
          npm audit || true

      - name: 📦 Phase 5: Dependency Security Scanning
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: 📊 Phase 8: Publish Security Reports & Excel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerability_Test_Results_Artifacts
          path: Vulnerability Test Results/
          retention-days: 30
