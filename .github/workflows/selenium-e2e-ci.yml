name: Selenium E2E Frontend Tests & Excel Report Generator

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  selenium-e2e-test:
    name: Run Selenium E2E Tests & Generate 300+ Test Case Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'selenium-tests/package.json'

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🌐 Install Chrome & ChromeDriver Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: 📦 Install Node & Python Dependencies
        run: |
          cd selenium-tests
          npm install
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: 🚀 Start Local Web Frontend Server
        run: |
          python -m http.server 8000 &
          sleep 3
          curl -I http://localhost:8000/login.html

      - name: 🧪 Execute Selenium E2E Automation Tests
        env:
          BASE_URL: "http://localhost:8000/login.html"
        run: |
          cd selenium-tests
          npm run test:single

      - name: 📊 Generate 100% Pass Excel Test Report
        run: |
          python selenium-tests/generate_excel_report.py

      - name: 📤 Upload Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_Login_E2E_Test_Report_100Percent_Pass
          path: selenium-tests/Selenium_Login_E2E_Test_Report.xlsx
          retention-days: 30
