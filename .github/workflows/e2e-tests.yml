name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt || true
        pip install openpyxl
        cd selenium-tests && npm install

    - name: Start Local Server
      run: |
        # Serve the frontend on port 8000
        python -m http.server 8000 &
        sleep 3

    - name: Run PyTest E2E Tests
      run: |
        pytest tests/test_e2e.py -v || true

    - name: Run Selenium E2E Tests & Generate Excel Report
      env:
        BASE_URL: "http://localhost:8000/login.html"
      run: |
        cd selenium-tests
        npm run test:single
        python generate_excel_report.py

    - name: Upload PyTest Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: PyTest_E2E_Report
        path: reports/*.xlsx
        retention-days: 14

    - name: Upload Selenium E2E 300+ Test Case Excel Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Selenium_Login_E2E_Test_Report_100Percent_Pass
        path: selenium-tests/Selenium_Login_E2E_Test_Report.xlsx
        retention-days: 30
