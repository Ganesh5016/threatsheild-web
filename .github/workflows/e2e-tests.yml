name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt || true
        pip install openpyxl pandas
        cd selenium-tests && npm install
        cd ../appium-tests && npm install
        cd ../load-tests && npm install

    - name: Start Local Web Server
      run: |
        python -m http.server 8000 &
        sleep 3

    - name: Run PyTest E2E Tests
      run: |
        pytest tests/test_e2e.py -v || true

    - name: Run Selenium E2E Tests
      env:
        BASE_URL: "http://localhost:8000/login.html"
      run: |
        cd selenium-tests
        npm run test:single
        python generate_excel_report.py

    - name: Run Appium E2E Tests
      run: |
        cd appium-tests
        npm run test:single
        python generate_appium_excel_report.py

    - name: Run Baseline Load Tests
      run: |
        cd load-tests
        node baseline-load-test.js
        python generate_load_test_report.py

    - name: Generate Master 4-in-1 Excel Test Report
      run: |
        python generate_master_excel_report.py

    - name: Upload All 4 Excel Reports Artifact Bundle
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: All_4_Excel_Test_Reports_Bundle
        path: |
          reports/*.xlsx
          selenium-tests/Selenium_Login_E2E_Test_Report.xlsx
          appium-tests/Appium_Mobile_App_E2E_Test_Report.xlsx
          load-tests/Baseline_Load_Test_Report.xlsx
          Master_ThreatShield_E2E_Test_Report.xlsx
        retention-days: 30
