name: Baseline Load Testing & Performance Benchmark CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  load-test:
    name: Run Baseline Load Test (100 VUs, 1 Min) & Generate Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          cd load-tests
          npm install
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: 🚀 Start Local API Server
        run: |
          python -m http.server 8000 &
          sleep 3

      - name: ⚡ Execute 100 VU Baseline Load Test (1 Minute)
        env:
          TARGET_URL: "http://localhost:8000/login.html"
          VUS: "100"
          DURATION: "60"
        run: |
          cd load-tests
          node baseline-load-test.js

      - name: 📊 Generate Baseline Load Test Excel Report
        run: |
          python load-tests/generate_load_test_report.py

      - name: 📤 Upload Load Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Baseline_Load_Test_Report
          path: load-tests/Baseline_Load_Test_Report.xlsx
          retention-days: 30
